name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project archive
        shell: bash
        run: |
          set -euo pipefail
          test -s ControlCenterNonRoot-Android12-Fixed.zip
          mkdir -p "$RUNNER_TEMP/project"
          unzip -q ControlCenterNonRoot-Android12-Fixed.zip -d "$RUNNER_TEMP/project"
          settings_file="$(find "$RUNNER_TEMP/project" -type f -name settings.gradle -print -quit)"
          test -n "$settings_file"
          echo "PROJECT_DIR=$(dirname "$settings_file")" >> "$GITHUB_ENV"

      - name: Validate project files
        run: |
          test -f "$PROJECT_DIR/settings.gradle"
          test -f "$PROJECT_DIR/build.gradle"
          test -f "$PROJECT_DIR/app/build.gradle"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        run: test -s "${PROJECT_DIR}/app/build/outputs/apk/debug/app-debug.apk"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ControlCenter-Android12-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
